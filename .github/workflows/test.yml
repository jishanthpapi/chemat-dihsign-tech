name: tests
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[test]"
      - run: python scripts/build_catalog.py
      - run: git diff --exit-code -- data/catalog.json backend/chemat/catalog.json
      - run: python -m pytest -q --junitxml=reports/pytest.xml
      - run: python -m pip wheel --no-deps --wheel-dir reports/wheels .
      - run: python scripts/verify_package.py
      - run: python scripts/smoke_server.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: reports/*.xml
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test --concurrency=1 --machine > test-results.json
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-report
          path: mobile/test-results.json
  two-client-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
      - run: pip install -e ".[test]"
      - run: flutter pub get
        working-directory: mobile
      - run: python scripts/run_two_client_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-client-ui-evidence
          path: reports/two-client-ui/
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
      - run: flutter pub get
        working-directory: mobile
      - run: flutter build apk --debug
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
